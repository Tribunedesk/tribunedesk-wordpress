name: Plugin CI

# Repo nie mialo zadnego CI, a od 0.7.1 to, co CI spakuje, instaluje sie samo
# w nocy u klientow. Pipeline wydania bez bramki testowej znaczylby, ze pierwszym
# artefaktem, jaki auto-updater kiedykolwiek rozesle, jest kod, ktorego nikt nie uruchomil.
#
# Testy jada TA SAMA komenda co lokalnie (npx @wordpress/env), zeby "zielone u mnie"
# i "zielone w CI" nie mogly sie rozjechac.

on:
  push:
    branches: [main]
  pull_request:
  # contract-drift.yml starts this on contract/latest: a pull request opened with GITHUB_TOKEN
  # starts no workflow, workflow_dispatch is the exception GitHub allows.
  workflow_dispatch:

jobs:
  php:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    # 8.3 = minimum z composer.json (klienci na wlasnych serwerach), 8.5 = nasze WordPressy.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    # wp-env bierze wersje PHP z tej zmiennej przed phpVersion z .wp-env.json.
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Kopie kontraktu w tests/contract musza byc bajt w bajt tym, co lezy pod tagiem
      # repo publicznego z pola "contract" manifestu tribunedesk.json. Testy czytaja kopie
      # (bez sieci), a ten krok pilnuje, ze kopie to opublikowany kontrakt. Kopia guide/
      # sluzy mapie funkcji docs/contract-map.json (tests/test-contract-map.php).
      - name: Kontrakt z otagowanej wersji tribunedesk-cms-api
        run: |
          tag="v$(php -r 'echo json_decode(file_get_contents("tribunedesk.json"))->contract;')"
          git -c core.autocrlf=false clone -q --depth 1 --branch "$tag" https://github.com/Tribunedesk/tribunedesk-cms-api /tmp/api
          cmp /tmp/api/openapi.json tests/contract/openapi.json
          cmp /tmp/api/examples/payloads/article-delivered.json tests/contract/article-delivered.json
          diff -r /tmp/api/guide tests/contract/guide

      # src/Protocol to kopia biblioteki tribunedesk/cms-protocol z tagu z pola "protocol"
      # manifestu: zmiana regul protokolu idzie najpierw do biblioteki, potem kopia tutaj.
      # Testy jednostkowe tych klas biegna w CI biblioteki; tutaj ich nie ma, wiec ten diff
      # jest jedynym dowodem, ze kopia to przetestowany kod. Nie luzowac go bez przeniesienia testow.
      - name: Kopia biblioteki z tagu
        run: |
          git clone -q --depth 1 --branch "v$(php -r 'echo json_decode(file_get_contents("tribunedesk.json"))->protocol;')" https://github.com/Tribunedesk/tribunedesk-cms-php /tmp/lib
          diff -r /tmp/lib/src src/Protocol

      # php -l na kazdym pliku. xargs zwraca != 0, gdy ktorykolwiek php -l padl.
      - name: Lint PHP
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      # Katalog roboczy na runnerze nazywa sie tak jak repo, a wp-env montuje
      # wtyczke pod nazwa katalogu — stad --env-cwd z nazwy repo (dziala w kazdym repo).
      - name: Start wp-env
        run: npx @wordpress/env start

      # Bez tego zielone "8.5" mogloby byc 8.3 z .wp-env.json, gdyby wp-env zignorowal zmienna.
      - name: PHP w kontenerze testow
        run: |
          v=$(npx @wordpress/env run tests-cli php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;' 2>/dev/null | tail -n1)
          echo "tests-cli PHP: $v"
          test "$v" = "${{ matrix.php }}"

      - name: Composer install
        run: npx @wordpress/env run tests-cli --env-cwd=wp-content/plugins/${{ github.event.repository.name }} bash -c "composer install --no-interaction"

      - name: PHPUnit
        run: npx @wordpress/env run tests-cli --env-cwd=wp-content/plugins/${{ github.event.repository.name }} ./vendor/bin/phpunit

  # Spec "kontrakt najpierw" D2e (Tribunedesk/tribunedesk-cms-kit): wtyczka przechodzi ten sam
  # `tdkit check` co kazdy inny CMS, z tdkit z pola "kit" manifestu. WordPress stoi na runnerze,
  # nie w wp-env: atrapa tdkit i WordPress musza sie widziec na 127.0.0.1 w obie strony. API
  # atrapy idzie po https przez proxy TLS na certyfikacie testowym kitu, bo wtyczka wysyla token
  # tylko po https; ci/tdkit/mu-plugin.php ufa temu CA tylko w tym jobie (poza ZIP-em wydania).
  tdkit:
    name: tdkit check
    runs-on: ubuntu-26.04
    # Rewizja D2e: job ma trwac ~10 min; limit lapie zawieszenie zamiast 6 h runnera.
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      SITE: ${{ github.workspace }}/../wp-site
      # Publiczne wartosci testowe atrapy (README kitu), nie sekrety.
      TD_WEBHOOK_SECRET: whsec_dGRraXQtbW9jay1zaWduaW5nLXNlY3JldC0wMDAwMDA=
      TD_API_HTTPS: https://127.0.0.1:8443
      WP_CLI_VERSION: '2.12.0'
      WP_CLI_SHA512: be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832
      POLYLANG_VERSION: '3.9.2'
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, curl, mbstring, zip, intl
          coverage: none

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"

      - name: Wersje z tribunedesk.json
        run: |
          echo "CONTRACT=$(php -r 'echo json_decode(file_get_contents("tribunedesk.json"))->contract;')" >> "$GITHUB_ENV"
          echo "KIT=$(php -r 'echo json_decode(file_get_contents("tribunedesk.json"))->kit;')" >> "$GITHUB_ENV"

      - name: WP-CLI
        run: |
          curl -fsSLo /tmp/wp "https://github.com/wp-cli/wp-cli/releases/download/v$WP_CLI_VERSION/wp-cli-$WP_CLI_VERSION.phar"
          echo "$WP_CLI_SHA512  /tmp/wp" | sha512sum -c -
          sudo install -m 0755 /tmp/wp /usr/local/bin/wp

      - name: tdkit z tagu v${{ env.KIT }}
        run: |
          uv tool install "git+https://github.com/Tribunedesk/tribunedesk-cms-kit@v$KIT"
          tls="$("$(uv tool dir)/tdkit/bin/python" -c 'from tdkit.mock import tls; print(tls.CA_BUNDLE.parent)')"
          echo "TLS_DIR=$tls" >> "$GITHUB_ENV"
          echo "TD_CA_BUNDLE=$tls/ca.pem" >> "$GITHUB_ENV"
          tdkit manifest validate tribunedesk.json

      # Atrapa wystawia API po http na 8787 (startuje ja dopiero `tdkit check`); proxy podaje je
      # po https na 8443 z tym samym certyfikatem testowym co pliki (spec D5).
      - name: Proxy TLS przed API atrapy
        run: |
          sudo apt-get install -y -qq socat > /dev/null
          socat "OPENSSL-LISTEN:8443,reuseaddr,fork,bind=127.0.0.1,cert=$TLS_DIR/server.pem,key=$TLS_DIR/server-key.pem,verify=0" TCP:127.0.0.1:8787 > "$RUNNER_TEMP/socat.log" 2>&1 &

      - name: WordPress na runnerze
        run: bash ci/tdkit/site.sh "$SITE" http://127.0.0.1:8888 "$GITHUB_WORKSPACE"

      # Kilka workerow: jednowatkowy serwer szeregowalby rownolegle proby jednej dostawy i
      # l1-overlapping-attempts przechodzilby bez dowodu blokady. Ostatnie polecenie to sprawdza.
      - name: Start strony
        run: |
          cd "$SITE"
          printf '%s\n' '<?php sleep(2); echo "ok";' > tdkit-sleep.php
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8888 > "$RUNNER_TEMP/php.log" 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS -o /dev/null "http://127.0.0.1:8888/?rest_route=/" && break
            sleep 0.2
          done
          start=$(date +%s)
          curl -fsS http://127.0.0.1:8888/tdkit-sleep.php > /dev/null &
          other=$!
          curl -fsS http://127.0.0.1:8888/tdkit-sleep.php > /dev/null
          wait "$other"
          test $(( $(date +%s) - start )) -lt 4 || { echo "::error::php -S serves one request at a time"; exit 1; }
          rm tdkit-sleep.php

      - name: tdkit check, poziomy 1-4, webhook
        run: |
          cd "$SITE"
          tdkit check --levels 1,2,3,4 --mode webhook --contract "v$CONTRACT" \
            --webhook "http://127.0.0.1:8888/?rest_route=/tribunedesk/v1/receive" \
            --social-flag --backfill --media-fields alt,caption \
            --inspect-cmd "wp td inspect {article_id}" \
            --publish-cmd "wp --user=editor td publish {article_id}" \
            --sync-cmd "wp td sync --backfill" \
            --media-inspect-cmd "wp td media inspect {cms_media_id}" \
            --media-add-cmd "wp --user=editor td media add {file}" \
            --media-edit-cmd "wp --user=editor td media edit {cms_media_id} {field} {value}" \
            --media-delete-cmd "wp --user=editor td media delete {cms_media_id}" \
            --reset-cmd "wp td reset" \
            --json "$RUNNER_TEMP/tdkit-report.json"

      - name: Raport i logi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdkit-report
          path: |
            ${{ runner.temp }}/tdkit-report.json
            ${{ runner.temp }}/php.log
            ${{ runner.temp }}/socat.log
          if-no-files-found: ignore

  # Ochrona main wymaga checku o nazwie "test"; job z macierza raportuje sie jako
  # "test (PHP x.y)", wiec ten job zbiera obie wersje pod ta jedna nazwa.
  # Od etapu 5b takze job tdkit: wtyczka przechodzi tdkit check, inaczej main jej nie przyjmie.
  test:
    needs: [php, tdkit]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.php.result }}" = success
      - run: test "${{ needs.tdkit.result }}" = success
