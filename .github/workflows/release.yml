name: Release

# Tag buduje i wgrywa ARTEFAKT. manifest.json podmienia dopiero publish-manifest.yml,
# uruchamiany recznie — bo opublikowanie manifestu to deploy na wszystkie instalacje
# klientow naraz, a wiki projektu mowi: push i deploy to dwie osobne, swiadome decyzje.
#
# Podpis Ed25519 (od 2.8.0, docs/update-signing.md): job `sign` jest jedynym miejscem z kluczem
# prywatnym — w srodowisku `plugin-signing`, ktore czeka na akceptacje ownera. Klucze R2 sa
# w jobie `upload`, klucza podpisu tam nie ma. Kto ma tylko R2, nie zrobi waznego podpisu.

on:
  push:
    tags:
      - 'v*'

env:
  PLUGIN_SLUG: headlinesforge-receiver

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # bramka kontraktu porownuje src/ z poprzednim tagiem v*
      - name: Bramka spojnosci wersji
        run: bash bin/check-version.sh "${GITHUB_REF_NAME#v}"
      # Klienci dostaja to, co przeszlo CI na main: tag na commicie spoza main nie buduje ZIP-a.
      - name: Tag na main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME nie wskazuje commita z main"; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Audyt 2026-11-27: 2.5.0 wyszla z zachowaniem, ktorego przypiety kontrakt jeszcze nie
      # opisywal. Zmiana w src/ od poprzedniego tagu wymaga w changelogu readme.txt odnosnika do
      # sekcji przypietego przewodnika (tests/contract/guide) albo linii `wp_only: <powod>`.
      - name: Bramka kontraktu (zachowanie nie wyprzedza przypietego kontraktu)
        run: php ci/release-contract.php "${GITHUB_REF_NAME#v}"

  # 2.7.1 (audyt 27.11): ta sama bramka co na main (kontrakt z tagu, kopia biblioteki, PHPUnit
  # na 8.3 i 8.5, tdkit check). Wczesniej release mial wlasna, slabsza kopie testow.
  ci:
    uses: ./.github/workflows/plugin-ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-26.04
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6

      - name: Ustal wersje
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Folder w archiwum nazywa sie headlinesforge-receiver/ — koniec z reczna
      # zmiana nazwy przez klienta. W srodku wylacznie runtime.
      - name: Zbuduj ZIP
        run: |
          set -euo pipefail
          mkdir -p "build/${PLUGIN_SLUG}"
          cp headlinesforge-receiver.php uninstall.php readme.txt "build/${PLUGIN_SLUG}/"
          cp -r src "build/${PLUGIN_SLUG}/"
          # 1.17.0: editor script of the "Read more" block (no build step).
          cp -r assets "build/${PLUGIN_SLUG}/"
          # 2.0.0: translations (tribune-desk text domain, Polish today).
          cp -r languages "build/${PLUGIN_SLUG}/"
          if [ -f LICENSE ]; then cp LICENSE "build/${PLUGIN_SLUG}/"; fi
          cd build
          zip -r -q "../${PLUGIN_SLUG}-${VERSION}.zip" "${PLUGIN_SLUG}"
          cd ..
          unzip -l "${PLUGIN_SLUG}-${VERSION}.zip"

      - name: Policz sha256
        id: sha
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${PLUGIN_SLUG}-${VERSION}.zip" | cut -d' ' -f1)"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha256 = ${SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: ${{ env.PLUGIN_SLUG }}-*.zip
          if-no-files-found: error
          retention-days: 7

  # Podpisuje sama sume (slug + wersja + sha256, UpdateSignature::message), nie dotyka ZIP-a
  # ani R2. Srodowisko `plugin-signing`: wymagana akceptacja ownera, tylko tagi v*.
  sign:
    needs: build
    runs-on: ubuntu-26.04
    environment: plugin-signing
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Podpisz
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          SIG="$(php bin/sign-update.php "${GITHUB_REF_NAME#v}" "${SHA256}")"
          echo "signature=${SIG}" >> "$GITHUB_OUTPUT"
          echo "podpis = ${SIG}"

  upload:
    needs: [build, sign]
    runs-on: ubuntu-26.04
    env:
      SHA256: ${{ needs.build.outputs.sha256 }}
      SIGNATURE: ${{ needs.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Ustal wersje
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - name: Sprawdz, ze ZIP to ten podpisany
        run: |
          set -euo pipefail
          test "$(sha256sum "${PLUGIN_SLUG}-${VERSION}.zip" | cut -d' ' -f1)" = "${SHA256}"

      # build-manifest.php odmawia, gdy podpis nie weryfikuje sie kluczem z UpdateSignature.
      - name: Zbuduj sidecar manifestu
        run: |
          set -euo pipefail
          PACKAGE="${{ vars.R2_PUBLIC_BASE_URL }}/wp-plugin/${PLUGIN_SLUG}-${VERSION}.zip"
          php bin/build-manifest.php "${VERSION}" "${SHA256}" "${PACKAGE}" "${SIGNATURE}" > "${PLUGIN_SLUG}-${VERSION}.json"
          cat "${PLUGIN_SLUG}-${VERSION}.json"

      - name: Wgraj na R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PLUGIN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PLUGIN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 odrzuca dodatkowe sumy kontrolne, ktore AWS CLI v2 wysyla domyslnie.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          aws s3 cp "${PLUGIN_SLUG}-${VERSION}.zip" \
            "s3://${R2_BUCKET_NAME}/wp-plugin/${PLUGIN_SLUG}-${VERSION}.zip" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --content-type application/zip \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "${PLUGIN_SLUG}-${VERSION}.json" \
            "s3://${R2_BUCKET_NAME}/wp-plugin/${PLUGIN_SLUG}-${VERSION}.json" \
            --endpoint-url "${R2_ENDPOINT_URL}" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Potwierdz, ze artefakt jest publicznie dostepny
        run: |
          set -euo pipefail
          URL="${{ vars.R2_PUBLIC_BASE_URL }}/wp-plugin/${PLUGIN_SLUG}-${VERSION}.zip"
          curl -sS -o downloaded.zip -w 'http=%{http_code}\n' "$URL"
          DOWNLOADED="$(sha256sum downloaded.zip | cut -d' ' -f1)"
          echo "sha256 pobranego = ${DOWNLOADED}"
          test "${DOWNLOADED}" = "${SHA256}"
          echo "Artefakt zgodny. manifest.json NIETKNIETY - opublikuj recznie przez publish-manifest."
